spring:
  application:
    name: wikilens-server
  threads:
    virtual:
      # **끈다.** 켜져 있었지만 근거가 적힌 적이 없고, 이 워크로드는 가상 스레드가
      # 이기는 조건에 하나도 안 맞는다:
      #
      #   - 아웃바운드 호출이 0이다. 서버가 말단이라 기다릴 원격 대상이 없다
      #     (가상 스레드의 이득은 "느린 원격 호출에 블록된 스레드가 수천 개"에서 나온다).
      #   - 일이 CPU(Lucene)와 파일 I/O(grep·read)다. 파일 I/O 는 가상 스레드의 알려진
      #     한계로 언마운트되지 않고 캐리어를 블록한다 — grep 은 요청당 수천 파일을 읽는다.
      #   - 동시성이 수십 규모다. Claude Code 세션당 MCP 프록시 하나이고 소규모 팀
      #     대상이라 Tomcat 기본 스레드로 남는다.
      #   - Lucene `Analyzer` 는 `CloseableThreadLocal` 로 TokenStream 을 재사용하는데
      #     가상 스레드는 일회용이라 그 재사용이 매번 무효가 된다.
      #
      # **안전성이 JDK 버전에 걸려 있던 것도 이유다.** `TrajectoryStore` 는 락을 쥔 채
      # 파일 I/O 를 한다(`finalize` → `sink.append`). JDK 21 이었다면 캐리어가 핀 됐고,
      # JEP 491(JDK 24)로 `synchronized` 핀닝이 사라져서야 무해해졌다 — 툴체인을
      # 내리면 조용히 나빠지는 설정이었다.
      #
      # **재봤고 차이가 없었다**(2026-08-08, 실제 코퍼스 13,921건). 켬/끔을 번갈아 세 번,
      # grep(문서/초)과 search(요청/초)를 동시성 1·4·16·64 로:
      #
      #     grep/4    OFF 59,184 · ON 50,827 · OFF 50,618
      #     grep/16   OFF 71,565 · ON 59,201 · OFF 62,893
      #     search/16 OFF  2,523 · ON  3,630 · OFF  4,296
      #
      # **모든 항목에서 ON 값이 OFF 두 번의 범위 안에 든다.** OFF 자기 재현 편차가
      # 12~41% 인데 ON/OFF 차이가 그보다 작아 설정이 아니라 노이즈를 잰 것이다.
      #
      # 도중에 두 번 속았다 — 첫 대조는 ON 을 먼저 재서 **캐시가 차가웠고**(ON 을 뜨거운
      # 상태로 다시 재니 11,910 → 19,412), 첫 측정기는 요청 수가 적어 부호가 오락가락했다.
      #
      # 그래서 얻는 게 없으면 단순한 쪽(기본값)을 둔다 — 안전성이 JDK 24+ 에 걸리는
      # 의존도 함께 지운다. **되돌릴 조건:** 서버가 외부를 호출하기 시작하거나(임베딩 API 등)
      # 동시 접속이 수천 규모가 되면. 그때 같은 방법으로 다시 잴 것.
      enabled: false
  jackson:
    default-property-inclusion: non_null

server:
  port: 8787

wikilens:
  # Python `wikilens sync` 가 만든 미러 루트 (서비스 계정으로 1회 싱크)
  vault-root: ~/.wikilens/vault
  index-dir: ~/.wikilens/index
  state-dir: ~/.wikilens/state

  # /api/admin/* 공유 토큰. **비어 있으면 관리 API 가 전부 404.**
  #
  # 없으면 서버에 닿는 누구나 `POST /api/admin/acl/user?userKey=자기자신` 으로 스스로
  # 권한을 부여한다 — 권한을 정확히 수집해도 이게 열려 있으면 의미가 없다.
  # 잠김을 기본으로 두는 이유는 열림이 기본이면 **조용히 열린 채 배포**되기 때문이다.
  #
  # 호출: `-H "X-WikiLens-Admin: <토큰>"`. 리버스 프록시(SSO) 뒤에 둘 거면 그 위에
  # 겹치면 되고, 이것만으로는 `userKey` 위조를 막지 못한다 — `DECISIONS.md` D18.
  admin-token: ""

  # 본문 스캔 엔진: auto(기본) · jvm · ripgrep
  #
  # 스캔 비용은 문서 **수**가 아니라 바이트에 붙는다. 문서당 약 28us(파일 고정비) +
  # 13us/KB 이고(합성 볼트 두 점에서 유도, `GrepScaleTest`), 예산 3초를 그것으로 나눈
  # 것이 한계다 — 평균 4KB 문서면 약 37,000건. **"몇 건" 으로 적힌 한계는 그 코퍼스의
  # 평균 문서 크기를 숨긴 채 옮겨진다.** rg 는 문서당 비용이 약 3~4배 싸다.
  # 한계에 닿으면 실패가 아니라 `truncated=true` 이고, 뒤쪽 문서는 영영 안 읽힌다.
  #
  # auto 는 rg 가 있으면 rg 다. 머신에 따라 경로가 갈리지만 두 경로가 같은 답을 내는지는
  # 계약과 `GrepEngineParityTest` 가 지킨다. 고정하려면 jvm 또는 ripgrep 을 명시할 것.
  # 어느 엔진이 처리했는지는 grep 응답의 `engine` 과 기동 로그에 나온다.
  grep-engine: auto

  # 질의 시점 ACL 시행. **기본은 꺼짐 — 접속한 누구나 색인된 전 문서를 본다.**
  #
  # 지금의 "ACL" 은 실질적으로 사용자 허용목록이다 — `sync` 가 권한을 수집하지 않아
  # 전 페이지가 `@public` 이고, 시행이 하는 일은 "등록된 사람인가" 뿐이다. 그런데
  # 등록을 안 하면 fail-closed 로 전원이 빈손이 되고 그 상태가 **"문서가 없다"와
  # 구별되지 않는다.** 얻는 것 없이 함정만 되므로 기본값을 껐다.
  #
  # **켜야 하는 경우:** 이 서버에 닿는 사람들이 볼트를 싱크한 계정의 권한 범위를
  # 공유하면 안 될 때. 그때는 `true` 로 바꾸고 `POST /api/admin/acl/user` 로 사람을
  # 등록해야 한다 — 등록 전까지는 전원이 0건이고, 그 상태가 "문서가 없다" 로 보인다.
  #
  # **꺼진 것이 조용하면 안 된다.** 기동 로그 WARN · `/api/stats` 의 `aclEnforced` ·
  # `--status` 의 `ACL_ENFORCED=no` 셋이 계속 말한다. 그 셋이 이 기본값의 전제다.
  acl-enforced: false

  # 본문 분석기: korean(Nori) · english · standard
  #
  # 이것은 "무엇으로 **지을까**" 다. 질의는 색인이 실제로 지어진 분석기를 쓰므로
  # (선택이 색인 커밋 데이터에 기록된다), 여기만 바꾸고 재색인을 안 하면 옛 분석기로
  # 계속 정상 동작한다 — 둘은 `POST /api/admin/reindex` 에서 만난다.
  #
  # 한국어 문서에 영문 고유명사·식별자가 섞인 코퍼스라면 korean 이 맞다. Nori 는 영문을
  # 깨뜨리지 않고 어간만 안 줄이는데, `Jenkins`·`DEPLOY_TOKEN` 같은 말은 굴절하지 않는다.
  # 영어 산문이 주된 코퍼스일 때만 english 로 바꿀 것 — 그러면 한국어 조사를 못 뗀다.
  analyzer: korean

  # 색인할 문서의 문자 집합. **비면 전부 색인한다(기본).**
  #
  # 다국어 코퍼스용이다. 같은 내용이 여러 언어로 있으면 **읽지 못하는 언어의 문서가
  # 어휘 순위에서 이길 수 있다** — 실측(한·베 혼재 13,933건): 한국어 질의에 베트남어
  # 번역본이 1위이고 한국어 원본이 10위 밖이었다. 두 문서가 같은 영문 식별자(`ga`·URL)를
  # 공유하는데 번역본이 두 배 길어 tf 가 높았다. 어휘 층은 정상 동작한 것이라
  # **언어 말고는 가를 신호가 없다.**
  #
  #   index-scripts: [hangul, ascii]                 한국어·영어만
  #   index-scripts: [hangul, ascii, vietnamese]     베트남어도 받는다
  #   index-scripts: [hangul, latin]                 라틴 전부 (불·독·베 포함)
  #   index-scripts: [hangul, ascii, "U+0100-017F"]  범위를 직접
  #
  # **`ascii` 를 빼지 말 것** — 코드·URL·영문이 전부 밖이 되어 거의 전 문서가 걸린다
  # (이 코퍼스는 본문의 46%가 ASCII 다).
  #
  # **문자 집합이지 언어가 아니다.** 라틴 하나에 100개 넘는 언어가 있어 `french` 같은
  # 이름은 원리적으로 만들 수 없다(`é è à ç` 를 스페인어·포르투갈어가 똑같이 쓴다).
  # 갈리는 것은 자기만 쓰는 범위가 있는 언어뿐이고 `vietnamese`(U+1EA0~1EF9)가 그 예다.
  # 이름이 없으면 범위를 직접 적으면 된다 — 모르는 이름은 **기동이 실패한다.**
  #
  # **빠진 문서는 통째로 사라진다** — `search`·`read`·`grep`·`tree` 넷 다 못 찾는다.
  # 그래서 제외 수를 기동 로그와 `/api/stats` 의 `droppedByScript` 가 말한다.
  # 기본이 꺼짐인 것도 같은 이유다: 켜짐이 기본이면 처음 띄운 사람의 문서가 조용히 사라진다.
  index-scripts: []

  # 선언 밖 **낱말**이 이 비율을 넘으면 색인에서 뺀다. `index-scripts` 가 비면 무의미.
  #
  # **글자가 아니라 낱말인 것이 요점이다.** 베트남어는 글자 대부분이 평범한 라틴이고
  # 성조부호만 다르다(`Sử dụng` 에서 이질적인 글자는 2/7). 글자로 세면 신호가 묽어진다 —
  # 실측(같은 문서): 글자 4.17% 대 낱말 16.6%. 낱말로 세면 글자마다 다른 한자·태국어와
  # 부호만 다른 베트남어가 **같은 척도**로 잡혀서 문턱 하나가 모든 문자 집합에 통한다.
  #
  # 숫자·기호만 있는 토큰(`2026`·`v1.2`)은 분모에서 뺀다 — 어느 언어에도 안 속하는데
  # 분모에 넣으면 코드가 많은 문서가 무조건 통과한다.
  #
  # **기본값 0.15 는 실측으로 정했다**(한·베 혼재 13,933건, `[hangul, ascii]` 선언):
  #
  #     문턱 0.30 → 163건 제외 — 문제의 번역본이 **안 걸린다**(그 문서는 16.6%)
  #     문턱 0.15 → 425건 제외 — 걸린다
  #     문턱 0.10 → 519건
  #     문턱 0.05 → 562건
  #
  # 번역본은 원본과 섞여 있다(영문 식별자·URL·코드가 그대로 남고 한국어도 일부 남는다).
  # 그래서 "전부 다른 언어" 를 기대하고 문턱을 높이면 정작 문제의 문서를 놓친다.
  # **여러분의 코퍼스에서 다시 재세요** — `/api/stats` 의 `droppedByScript` 가 그 수다.
  script-threshold: 0.15

  learn:
    # EB 하한이 이 값 미만이면 힌트를 서빙하지 않는다
    serve-threshold: 0.45
    # 앞 질의와 키워드가 이만큼 겹치면 앞 시도를 실패로 본다
    reformulation-overlap: 0.5
    # 버려진 세션을 거두는 주기와, 얼마나 조용하면 끝난 것으로 볼지 (ms)
    #
    # MCP 프록시가 SIGKILL 되면 `/api/session/end` 가 안 온다. 거두지 않으면 그 세션의
    # 궤적이 **확정되지 않아 학습에 안 들어간다** — 맵 누수보다 이쪽이 조용해서 나쁘다.
    sweep-interval-millis: 300000
    session-idle-millis: 1800000

logging:
  level:
    io.wikilens: INFO
