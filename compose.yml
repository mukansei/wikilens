# WikiLens 서버.
#
# **마운트 한 줄이 이 파일의 요점이다.** 이미지에는 코드만 있고 데이터는 전부 밖에 있다.
# `~/.wikilens` 를 통째로 붙이면 아래 셋이 한 번에 붙는다.
#
#   vault  위키 미러. `sync` 가 만든다. 서버는 읽기만 한다.
#   state  궤적 로그와 사용자 등록. **유일한 복구 불가 자산이다.** 백업 대상은 여기뿐.
#   index  Lucene 색인. 지워도 재색인으로 복구되지만 두면 기동이 빨라진다.
#
# **`:ro` 는 이제 안 건다.** 셋을 따로 마운트하던 시절에는 vault 만 읽기 전용으로
# 걸 수 있었는데, 한 줄로 합치면서 state·index 가 같은 마운트에 들어와 불가능해졌다
# (실측 2026-08-27: 컨테이너에서 볼트 파일을 고치면 호스트에도 반영된다).
# **읽기 전용 보장은 마운트 옵션이 아니라 "서버 코드에 `CONFLUENCE_*` 참조가 한 줄도
# 없다" 가 지킨다** — 계약이 그것을 검사한다. 아래 `volumes:` 주석도 같은 말이다.
#
# **싱크는 이 컨테이너가 안 한다.** `sync`·`acl` 은 Confluence 자격증명이 필요한데,
# 서버는 그걸 가질 이유가 없다(가지면 "위키에 쓰기 금지" 가 설계 보장에서 규율로
# 내려간다). 호스트에서 따로 돌리고 끝나면 재색인을 부른다 — 그 절차는
# `server/wikilens-refresh.sh` 하나이고 실패하면 재색인하지 않는다.

services:
  wikilens:
    build:
      # **컨텍스트가 저장소 루트다** — 이미지가 `cli/` 도 담기 때문이다.
      # 배제 목록은 루트 `.dockerignore` 가 정본이다(`server/.dockerignore` 는 안 읽힌다).
      context: .
      dockerfile: server/Dockerfile
    # **호스트 포트를 바꿀 수 있어야 한다** — 8787 이 이미 쓰이는 머신에서 이 파일을
    # 고치게 하면 그 수정이 `git pull` 마다 충돌한다. 컨테이너 안은 8787 고정이다
    # (`application.yml` 이 그 값이고, 사용자에게 알리는 주소만 밖에서 정한다).
    ports:
      - "${WIKILENS_PORT:-8787}:8787"
    # **셋 다 호스트의 `~/.wikilens` 아래다.** 상태·색인이 named volume 이던 때는
    # D15 의 "지우는 방법이 `rm -rf ~/.wikilens` 하나" 가 거짓이었고, 무엇보다
    # **유일한 복구 불가 자산인 궤적이 안 보이는 곳**에 있었다 — 백업하려면
    # `docker run --rm -v …` 를 쳐야 했고 `docker compose down -v` 한 번에 사라졌다.
    volumes:
      # **한 줄이다.** 호스트와 컨테이너의 경로가 같아서(`~/.wikilens`) 통째로
      # 붙이면 vault·state·index 가 한 번에 붙는다 — 셋을 따로 적던 시절에는
      # `state` 를 빠뜨리면 **궤적이 컨테이너와 함께 사라졌고** 그게 조용했다.
      #
      # **`env.sh`(자격증명)도 이 안에 있지만 서버는 그것을 안 읽는다** — 서버
      # 코드에 `CONFLUENCE_*` 참조가 한 줄도 없다(계약이 검사한다). 읽기 전용
      # 보장은 마운트 옵션이 아니라 **그 사실**이 지킨다. `sync` 는 별도 실행이고
      # 그때만 자격증명을 받는다.
      - ${WIKILENS_HOME:-~/.wikilens}:/data/.wikilens

    # **리눅스 호스트에서는 이 값을 줘야 한다.**
    #
    #     WIKILENS_UID=$(id -u) WIKILENS_GID=$(id -g) docker compose up -d
    #
    # bind mount 는 호스트의 소유권을 그대로 쓴다. 이미지는 uid 10001 로 도는데
    # `~/.wikilens` 는 700 이라(README 가 그렇게 만들라고 한다) **traverse 조차 안 된다**
    # — 실측(리눅스 권한 모델): `uid=10001` 이 700/uid=502 디렉터리를 `Permission denied`.
    # 그러면 색인이 0건이 된다(ERROR 로그는 남는다).
    #
    # **macOS 는 안 줘도 된다** — Docker Desktop 이 bind mount 소유권을 재매핑한다.
    # 그래서 **이 머신에서의 통과는 리눅스를 보증하지 않는다.**
    #
    # 700 을 풀지 않는 이유: 공용 서버에서 다른 로컬 사용자가 위키 본문을 읽으면 안 된다.
    user: "${WIKILENS_UID:-10001}:${WIKILENS_GID:-10001}"
    environment:
      # **기본이 잠김이다.** 안 주면 /api/admin 하위가 전부 404 — 그게 맞는 기본값이다.
      # 주려면 셸에서 export 하거나 .env 에 둔다. 이미지·compose 에 굽지 않는다.
      WIKILENS_ADMIN_TOKEN: ${WIKILENS_ADMIN_TOKEN:-}
      # ACL 시행. **앱 기본값(false)과 같아야 한다** — 여기만 true 로 두면 README 가
      # "기본은 꺼짐" 이라고 말하는데 권장 경로(compose)로 띄운 서버만 켜진 채 떠서,
      # 등록 전까지 전 검색이 0건이 된다. 에러가 아니라 0건이라 원인을 못 찾는다.
      # 켜려면 `WIKILENS_ACL_ENFORCED=true docker compose up -d`.
      WIKILENS_ACL_ENFORCED: ${WIKILENS_ACL_ENFORCED:-false}

      # **색인 시점에 정해지는 값이라 여기 있어야 한다**(D14). 질의는 설정이 아니라
      # 색인에 기록된 분석기를 따르므로, 바꾸려면 재색인해야 한다. 한국어가 아닌
      # 코퍼스에서 기본값을 그대로 두면 **에러 없이 검색 품질만 나빠진다** —
      # 조사를 뗄 것이 없는데 형태소 분석기를 물리는 셈이다.
      WIKILENS_ANALYZER: ${WIKILENS_ANALYZER:-korean}
    restart: unless-stopped

    # **이 한도가 없으면 이미지의 `-XX:MaxRAMPercentage=75` 가 아무것도 안 막는다.**
    # JVM 은 cgroup 한도를 보는데 그게 없으면 호스트 전체를 기준으로 잡는다 — 실측:
    # 한도 없이 띄운 컨테이너의 `MaxHeapSize` 가 6.18GB(호스트 7.7GB 의 75%)였다.
    # 다른 워크로드와 공유하는 서버에서 힙이 거기까지 자라면 남을 밀어낸다.
    #
    # 2g → 힙 상한 1.5g. 실측 기준선이 **빈 코퍼스 254MB** 이고, 궤적 100만 건이
    # 힙 80MB 다(CLAUDE.md). Lucene 색인은 mmap 이라 힙 밖이고 page cache 로 회수된다.
    # **코퍼스가 크거나 OOMKill 이 나면 올린다** — `WIKILENS_MEM_LIMIT=4g docker compose up -d`.
    mem_limit: ${WIKILENS_MEM_LIMIT:-2g}

    # 상주 서버라 로그가 무한히 쌓인다. 기동 로그를 진단에 쓰는 구조이므로 통째로
    # 끄지는 않고 회전만 시킨다 — 30MB 면 재기동 여러 번을 덮는다.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # **복제하지 않는다.** 상태 디렉터리는 한 프로세스만 쓰고(`StateDirLock` 이 둘째
    # 기동을 거부한다), 스케일 아웃하려면 state 볼륨을 나눠야 하는데 그러면 학습이
    # 갈린다. `deploy.replicas: 1` 을 적어뒀었지만 그건 기본값이라 아무것도 강제하지
    # 않는다 — 강제하는 것은 락이고, 여기 적을 것은 그 사실이다.

# **named volume 선언이 없다.** 셋 다 호스트 경로다 — 위 `volumes:` 참고.
# 그전 배포에서 올라온다면 옛 볼륨의 궤적을 옮길 것(`server/README.md`).
