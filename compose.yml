# WikiLens 서버.
#
# **볼륨 셋이 이 파일의 요점이다.** 이미지에는 코드만 있고 데이터는 전부 밖에 있다.
#
#   vault  위키 미러. `wikilens sync` 가 호스트에서 만든다. 서버는 읽기만 하므로
#          `:ro` 로 마운트한다 — 읽기 전용은 규율이 아니라 마운트 옵션으로 얻는다.
#   state  궤적 로그와 사용자 등록. **유일한 복구 불가 자산이다.** 백업 대상은 여기뿐.
#   index  Lucene 색인. 지워도 재색인으로 복구되지만 두면 기동이 빨라진다.
#
# **싱크는 이 컨테이너가 안 한다.** `sync`·`acl` 은 Confluence 자격증명이 필요한데,
# 서버는 그걸 가질 이유가 없다(가지면 "위키에 쓰기 금지" 가 설계 보장에서 규율로
# 내려간다). 호스트의 cron 이 돌리고 끝나면 재색인을 부른다:
#
#   wikilens sync --root ~/.wikilens/vault && wikilens acl --root ~/.wikilens/vault \
#     && curl -XPOST -H "X-WikiLens-Admin: $TOKEN" localhost:8787/api/admin/reindex
#
#   `&&` 가 필수다 — 실패했는데 재색인하면 반쪽 상태가 반영된다.

services:
  wikilens:
    build:
      context: ./server
    ports:
      - "8787:8787"
    volumes:
      - ${WIKILENS_VAULT:-~/.wikilens/vault}:/vault:ro
      - wikilens-state:/state
      - wikilens-index:/index
    environment:
      # **기본이 잠김이다.** 안 주면 /api/admin 하위가 전부 404 — 그게 맞는 기본값이다.
      # 주려면 셸에서 export 하거나 .env 에 둔다. 이미지·compose 에 굽지 않는다.
      WIKILENS_ADMIN_TOKEN: ${WIKILENS_ADMIN_TOKEN:-}
      # ACL 시행. 끄면 등록 없이 전원이 전 문서를 본다 — 볼트를 싱크한 계정의 권한
      # 범위를 이 서버에 닿는 전원이 공유해도 되는 배포에서만 맞다.
      WIKILENS_ACL_ENFORCED: ${WIKILENS_ACL_ENFORCED:-true}
    restart: unless-stopped
    # **복제하지 않는다.** 상태 디렉터리는 한 프로세스만 쓰고(`StateDirLock` 이 둘째
    # 기동을 거부한다), 스케일 아웃하려면 state 볼륨을 나눠야 하는데 그러면 학습이
    # 갈린다. `deploy.replicas: 1` 을 적어뒀었지만 그건 기본값이라 아무것도 강제하지
    # 않는다 — 강제하는 것은 락이고, 여기 적을 것은 그 사실이다.

volumes:
  wikilens-state:
  wikilens-index:
