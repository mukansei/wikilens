# WikiLens 서버.
#
# **볼륨 셋이 이 파일의 요점이다.** 이미지에는 코드만 있고 데이터는 전부 밖에 있다.
#
#   vault  위키 미러. `wikilens sync` 가 호스트에서 만든다. 서버는 읽기만 하므로
#          `:ro` 로 마운트한다 — 읽기 전용은 규율이 아니라 마운트 옵션으로 얻는다.
#   state  궤적 로그와 사용자 등록. **유일한 복구 불가 자산이다.** 백업 대상은 여기뿐.
#   index  Lucene 색인. 지워도 재색인으로 복구되지만 두면 기동이 빨라진다.
#
# **싱크는 이 컨테이너가 안 한다.** `sync`·`acl` 은 Confluence 자격증명이 필요한데,
# 서버는 그걸 가질 이유가 없다(가지면 "위키에 쓰기 금지" 가 설계 보장에서 규율로
# 내려간다). 호스트의 cron 이 돌리고 끝나면 재색인을 부른다:
#
#   wikilens sync --root ~/.wikilens/vault && wikilens acl --root ~/.wikilens/vault \
#     && curl -XPOST -H "X-WikiLens-Admin: $TOKEN" localhost:8787/api/admin/reindex
#
#   `&&` 가 필수다 — 실패했는데 재색인하면 반쪽 상태가 반영된다.

services:
  wikilens:
    build:
      context: ./server
    ports:
      - "8787:8787"
    volumes:
      - ${WIKILENS_VAULT:-~/.wikilens/vault}:/home/wikilens/.wikilens/vault:ro
      - wikilens-state:/home/wikilens/.wikilens/state
      - wikilens-index:/home/wikilens/.wikilens/index
    environment:
      # **기본이 잠김이다.** 안 주면 /api/admin 하위가 전부 404 — 그게 맞는 기본값이다.
      # 주려면 셸에서 export 하거나 .env 에 둔다. 이미지·compose 에 굽지 않는다.
      WIKILENS_ADMIN_TOKEN: ${WIKILENS_ADMIN_TOKEN:-}
      # ACL 시행. **앱 기본값(false)과 같아야 한다** — 여기만 true 로 두면 README 가
      # "기본은 꺼짐" 이라고 말하는데 권장 경로(compose)로 띄운 서버만 켜진 채 떠서,
      # 등록 전까지 전 검색이 0건이 된다. 에러가 아니라 0건이라 원인을 못 찾는다.
      # 켜려면 `WIKILENS_ACL_ENFORCED=true docker compose up -d`.
      WIKILENS_ACL_ENFORCED: ${WIKILENS_ACL_ENFORCED:-false}
    restart: unless-stopped

    # **이 한도가 없으면 이미지의 `-XX:MaxRAMPercentage=75` 가 아무것도 안 막는다.**
    # JVM 은 cgroup 한도를 보는데 그게 없으면 호스트 전체를 기준으로 잡는다 — 실측:
    # 한도 없이 띄운 컨테이너의 `MaxHeapSize` 가 6.18GB(호스트 7.7GB 의 75%)였다.
    # 다른 워크로드와 공유하는 서버에서 힙이 거기까지 자라면 남을 밀어낸다.
    #
    # 2g → 힙 상한 1.5g. 실측 기준선이 **빈 코퍼스 254MB** 이고, 궤적 100만 건이
    # 힙 80MB 다(CLAUDE.md). Lucene 색인은 mmap 이라 힙 밖이고 page cache 로 회수된다.
    # **코퍼스가 크거나 OOMKill 이 나면 올린다** — `WIKILENS_MEM_LIMIT=4g docker compose up -d`.
    mem_limit: ${WIKILENS_MEM_LIMIT:-2g}

    # 상주 서버라 로그가 무한히 쌓인다. 기동 로그를 진단에 쓰는 구조이므로 통째로
    # 끄지는 않고 회전만 시킨다 — 30MB 면 재기동 여러 번을 덮는다.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # **복제하지 않는다.** 상태 디렉터리는 한 프로세스만 쓰고(`StateDirLock` 이 둘째
    # 기동을 거부한다), 스케일 아웃하려면 state 볼륨을 나눠야 하는데 그러면 학습이
    # 갈린다. `deploy.replicas: 1` 을 적어뒀었지만 그건 기본값이라 아무것도 강제하지
    # 않는다 — 강제하는 것은 락이고, 여기 적을 것은 그 사실이다.

volumes:
  wikilens-state:
  wikilens-index:
