; 저장소 루트에서 한 번에 걷는다. 테스트가 두 곳에 있기 때문이다:
;
;   cli/tests/      wikilens 패키지(싱크·파싱·앵커 전치)를 시험한다
;   plugin/tests/   플러그인을 시험한다 — `plugin/local`, `plugin/client` 는 설치 시
;                   **통째로 캐시에 복사**되므로 그 안에 테스트를 두면 사용자에게
;                   딸려간다. 두 디렉터리 **밖**이어야 한다.
;
; `cli/pyproject.toml` 에도 `testpaths = ["tests"]` 가 있다. 지우지 말 것 —
; `cd cli && pytest` 로 CLI 만 돌리는 경로가 살아 있어야 한다. 여기 설정은
; 루트에서 실행할 때만 적용된다.
[pytest]
testpaths = cli/tests plugin/tests bench/tests
